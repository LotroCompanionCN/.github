name: Update latest release on org overview

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$(gh api repos/LotroCompanionCN/lotro-companion-release/releases/latest \
            --jq '{tag:.tag_name, published:.published_at}')"
          tag="$(jq -r .tag <<<"$out")"
          date="$(jq -r .published <<<"$out")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          DATE: ${{ steps.latest.outputs.date }}
        run: |
          sed -i "s|<!-- LC_VERSION -->.*|<!-- LC_VERSION -->\`$TAG\`|" profile/README.md
          sed -i "s|<!-- LC_DATE -->.*|<!-- LC_DATE -->\`$DATE\`|" profile/README.md

      - name: Commit and push
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore: update latest release to \`$TAG\`"
          git push
